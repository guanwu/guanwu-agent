# Builds one self-contained bundle per supported platform and attaches a zip
# of each bundle when the run is triggered by a release.
name: Build release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: windows_x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and test
        shell: cmd
        run: build.cmd win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: guanwu-agent-win-x64
          path: release/win-x64/
          if-no-files-found: error

  linux:
    name: linux_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            runner: ubuntu-22.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Build and test
        run: bash build.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: guanwu-agent-${{ matrix.rid }}
          path: release/${{ matrix.rid }}/
          if-no-files-found: error

  macos:
    name: macos_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: osx-x64
            runner: macos-15-intel
          - arch: arm64
            rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and test
        run: bash build.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: guanwu-agent-${{ matrix.rid }}
          path: release/${{ matrix.rid }}/
          if-no-files-found: error

  release-assets:
    name: attach bundles to the release
    needs: [windows-x64, linux, macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip one bundle per platform
        run: |
          cd dist
          for directory in guanwu-agent-*; do
            zip -qr "$directory-${GITHUB_REF_NAME}.zip" "$directory"
          done

      - name: Upload the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
